<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70">
  <defs>
    <style>
      .grupo-text { font-family: 'Arial', sans-serif; font-weight: bold; font-size: 9px; letter-spacing: 1px; }
      .micro-text { font-family: 'Arial Black', 'Arial', sans-serif; font-weight: 900; font-size: 36px; }
      .tec-text { font-family: 'Arial Black', 'Arial', sans-serif; font-weight: 900; font-size: 36px; }
    </style>
  </defs>

  <!-- GRUPO vertical - blanco -->
  <text class="grupo-text" fill="#FFFFFF" transform="rotate(-90 12 52)">
    <tspan x="12" y="52">GRUPO</tspan>
  </text>

  <!-- MICRO- blanco -->
  <text class="micro-text" x="22" y="46" fill="#FFFFFF">MICRO-</text>

  <!-- TEC blanco con tono verde claro -->
  <text class="tec-text" x="198" y="46" fill="#98E676">TEC</text>

  <!-- Símbolo ® blanco -->
  <g transform="translate(295, 12)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">R</text>
  </g>

  <!-- Curva decorativa blanca con tono rosado -->
  <path d="M8 56 Q80 68 160 54 Q240 42 312 56" fill="none" stroke="#FF8A80" stroke-width="5" stroke-linecap="round"/>
</svg>
