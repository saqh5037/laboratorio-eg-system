<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme System Test - Lab EG</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 2rem;
    }

    .header h1 {
      color: #1a202c;
      margin-bottom: 0.5rem;
    }

    .header p {
      color: #718096;
    }

    .status {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      margin-top: 1rem;
    }

    .status.success {
      background: #c6f6d5;
      color: #22543d;
    }

    .status.error {
      background: #fed7d7;
      color: #742a2a;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .card {
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      color: #2d3748;
      margin-bottom: 1rem;
      font-size: 1.25rem;
    }

    .color-swatch {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .color-box {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      border: 2px solid #e2e8f0;
    }

    .color-info {
      flex: 1;
    }

    .color-name {
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 0.25rem;
    }

    .color-value {
      font-family: 'Courier New', monospace;
      font-size: 0.875rem;
      color: #718096;
    }

    .var-display {
      background: #f7fafc;
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      font-family: 'Courier New', monospace;
      font-size: 0.875rem;
      color: #2d3748;
      border-left: 3px solid #4299e1;
    }

    .btn {
      background: #4299e1;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #3182ce;
    }

    .btn:active {
      background: #2c5282;
    }

    .actions {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎨 Sistema de Temas Dinámico - Lab EG</h1>
      <p>Test de carga y aplicación de CSS variables desde theme_config</p>
      <div id="status" class="status">Cargando...</div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>🎨 Colores Principales</h2>
        <div id="primary-colors"></div>
      </div>

      <div class="card">
        <h2>📝 Tipografía</h2>
        <div id="typography"></div>
      </div>

      <div class="card">
        <h2>🌙 Modo Oscuro</h2>
        <div id="dark-mode"></div>
      </div>

      <div class="card">
        <h2>📐 Espaciado & Efectos</h2>
        <div id="spacing"></div>
      </div>
    </div>

    <div class="card">
      <h2>🔄 Acciones de Prueba</h2>
      <div class="actions">
        <button class="btn" onclick="testThemeUpdate()">Cambiar a Tema Azul</button>
        <button class="btn" onclick="resetTheme()">Restaurar Tema Lab EG</button>
        <button class="btn" onclick="reloadTheme()">Recargar Tema</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3005/api/theme';

    async function loadTheme() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        if (data.success) {
          const theme = data.data;
          applyThemeToDOM(theme);
          displayThemeInfo(theme);
          updateStatus('Tema cargado correctamente', 'success');
        } else {
          throw new Error('Error en respuesta de API');
        }
      } catch (error) {
        console.error('Error al cargar tema:', error);
        updateStatus('Error al cargar tema: ' + error.message, 'error');
      }
    }

    function applyThemeToDOM(theme) {
      const root = document.documentElement;

      // Aplicar todas las variables CSS
      root.style.setProperty('--color-primary', theme.color_primary);
      root.style.setProperty('--color-secondary', theme.color_secondary);
      root.style.setProperty('--color-accent', theme.color_accent);
      root.style.setProperty('--color-text-primary', theme.color_text_primary);
      root.style.setProperty('--color-text-secondary', theme.color_text_secondary);
      root.style.setProperty('--color-background', theme.color_background);
      root.style.setProperty('--color-surface', theme.color_surface);

      root.style.setProperty('--color-dark-bg', theme.color_dark_bg);
      root.style.setProperty('--color-dark-surface', theme.color_dark_surface);
      root.style.setProperty('--color-dark-text', theme.color_dark_text);

      root.style.setProperty('--font-family-primary', theme.font_family_primary);
      root.style.setProperty('--font-size-base', theme.font_size_base);

      root.style.setProperty('--border-radius-md', theme.border_radius_md);
      root.style.setProperty('--shadow-intensity', theme.shadow_intensity / 10);
    }

    function displayThemeInfo(theme) {
      // Primary Colors
      document.getElementById('primary-colors').innerHTML = `
        ${createColorSwatch('Primary', theme.color_primary)}
        ${createColorSwatch('Secondary', theme.color_secondary)}
        ${createColorSwatch('Accent', theme.color_accent)}
        ${createColorSwatch('Background', theme.color_background)}
      `;

      // Typography
      document.getElementById('typography').innerHTML = `
        <div class="var-display">Font: ${theme.font_family_primary}</div>
        <div class="var-display">Base Size: ${theme.font_size_base}</div>
        <div class="var-display">H1: ${theme.font_size_h1}</div>
        <div class="var-display">H2: ${theme.font_size_h2}</div>
      `;

      // Dark Mode
      document.getElementById('dark-mode').innerHTML = `
        ${createColorSwatch('Dark BG', theme.color_dark_bg)}
        ${createColorSwatch('Dark Surface', theme.color_dark_surface)}
        ${createColorSwatch('Dark Text', theme.color_dark_text)}
      `;

      // Spacing
      document.getElementById('spacing').innerHTML = `
        <div class="var-display">Border Radius: ${theme.border_radius_md}</div>
        <div class="var-display">Shadow Intensity: ${theme.shadow_intensity}/10</div>
        <div class="var-display">Glassmorphism: ${theme.glassmorphism_blur}</div>
        <div class="var-display">Logo Margin: ${theme.logo_margin}</div>
      `;
    }

    function createColorSwatch(name, color) {
      return `
        <div class="color-swatch">
          <div class="color-box" style="background-color: ${color};"></div>
          <div class="color-info">
            <div class="color-name">${name}</div>
            <div class="color-value">${color}</div>
          </div>
        </div>
      `;
    }

    function updateStatus(message, type) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
    }

    async function testThemeUpdate() {
      updateStatus('Aplicando tema azul...', 'success');

      // Simular cambio de tema (en producción esto iría al backend)
      const blueTheme = {
        color_primary: '#3B82F6',
        color_secondary: '#60A5FA',
        color_accent: '#93C5FD',
        color_text_primary: '#1E3A8A',
        color_text_secondary: '#3B82F6',
        color_background: '#FFFFFF',
        color_surface: '#EFF6FF',
        color_dark_bg: '#1E3A8A',
        color_dark_surface: '#1E40AF',
        color_dark_text: '#DBEAFE',
        font_family_primary: 'Inter',
        font_size_base: '1rem',
        font_size_h1: '2rem',
        font_size_h2: '1.69rem',
        border_radius_md: '0.5rem',
        shadow_intensity: 5,
        glassmorphism_blur: '12px',
        logo_margin: '37.8px'
      };

      applyThemeToDOM(blueTheme);
      displayThemeInfo(blueTheme);
      updateStatus('Tema azul aplicado (demo local)', 'success');
    }

    async function resetTheme() {
      updateStatus('Restaurando tema Lab EG...', 'success');
      await loadTheme();
    }

    async function reloadTheme() {
      updateStatus('Recargando tema...', 'success');
      await loadTheme();
    }

    // Cargar tema al iniciar
    loadTheme();
  </script>
</body>
</html>
