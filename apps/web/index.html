<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon-link" rel="icon" type="image/png" href="/LogoEG.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA Meta Tags (Dinámicos) -->
    <meta id="meta-theme-color" name="theme-color" content="#7B68A6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta id="meta-pwa-title" name="apple-mobile-web-app-title" content="Laboratorio" />
    <meta id="meta-app-name" name="application-name" content="Laboratorio" />
    <meta name="msapplication-TileColor" content="#7B68A6" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- SEO Meta Tags (Dinámicos) -->
    <meta id="meta-description" name="description" content="Sistema de laboratorio clínico" />
    <meta id="meta-keywords" name="keywords" content="laboratorio clínico, análisis" />
    <meta id="meta-author" name="author" content="Sistema de Laboratorio" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="Spanish" />
    <meta name="revisit-after" content="7 days" />

    <!-- Open Graph Meta Tags (Dinámicos) -->
    <meta id="og-title" property="og:title" content="Laboratorio - Sistema de Análisis Clínicos" />
    <meta id="og-description" property="og:description" content="Sistema profesional de análisis clínicos" />
    <meta id="og-type" property="og:type" content="website" />
    <meta id="og-url" property="og:url" content="" />
    <meta id="og-image" property="og:image" content="/Logo.png" />
    <meta id="og-site-name" property="og:site_name" content="Laboratorio" />
    <meta id="og-locale" property="og:locale" content="es_MX" />

    <!-- Twitter Card Meta Tags (Dinámicos) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta id="twitter-title" name="twitter:title" content="Laboratorio" />
    <meta id="twitter-description" name="twitter:description" content="Sistema profesional de análisis clínicos" />
    <meta id="twitter-image" name="twitter:image" content="/Logo.png" />

    <!-- PWA Icons (Dinámicos) -->
    <link id="apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="/LogoEG.png" />
    <link id="icon-32" rel="icon" type="image/png" sizes="32x32" href="/LogoEG.png" />
    <link id="icon-16" rel="icon" type="image/png" sizes="16x16" href="/LogoEG.png" />
    <link id="mask-icon" rel="mask-icon" href="/LogoEG.png" color="#7B68A6" />

    <!-- PWA Manifest (Dinámico desde API) -->
    <link rel="manifest" href="%VITE_CONFIG_API_URL%/api/pwa/manifest" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//fonts.gstatic.com">

    <!-- Performance hints - Logo preload -->
    <link rel="preload" href="/Logo.png" as="image" type="image/png" fetchpriority="high" />

    <title id="page-title">Laboratorio - Sistema de Análisis Clínicos</title>

    <!-- Script para PRE-FILL inmediato desde cache (elimina flash en visitas repetidas) -->
    <script>
    (function() {
      try {
        const cached = localStorage.getItem('eg_company_cache');
        const cacheTimestamp = localStorage.getItem('eg_company_cache_timestamp');

        // Usar cache si existe y es reciente (menos de 5 minutos)
        if (cached && cacheTimestamp) {
          const cacheAge = Date.now() - parseInt(cacheTimestamp);
          const maxAge = 5 * 60 * 1000; // 5 minutos

          if (cacheAge < maxAge) {
            const company = JSON.parse(cached);
            const pageTitle = company.seo_title || `${company.name || 'Laboratorio'} - Análisis Clínicos`;

            // Actualizar INMEDIATAMENTE desde cache (0ms delay)
            document.getElementById('page-title').textContent = pageTitle;

            // Actualizar meta tags críticos
            const updateCachedMeta = (id, content) => {
              const el = document.getElementById(id);
              if (el && content) {
                if (el.hasAttribute('content')) {
                  el.setAttribute('content', content);
                } else {
                  el.textContent = content;
                }
              }
            };

            updateCachedMeta('meta-pwa-title', company.pwa_short_name || company.short_name || company.name);
            updateCachedMeta('meta-app-name', company.pwa_short_name || company.short_name || company.name);
            updateCachedMeta('meta-description', company.seo_description);
            updateCachedMeta('og-title', pageTitle);
            updateCachedMeta('og-site-name', company.name);

            console.log('⚡ Pre-filled desde cache:', company.name);
          } else {
            // Cache muy viejo, limpiar
            localStorage.removeItem('eg_company_cache');
            localStorage.removeItem('eg_company_cache_timestamp');
          }
        }
      } catch (e) {
        console.warn('Cache no disponible o inválido');
      }
    })();
    </script>

    <!-- Script para cargar metadata dinámica DESDE API (actualiza cache) -->
    <script>
    (async function() {
      try {
        // IMPORTANTE: Usar variable de entorno en lugar de detectar localhost
        // Esto permite que funcione tanto en desarrollo como en Docker
        const apiUrl = '%VITE_CONFIG_API_URL%/api/company';

        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('API no disponible');

        const result = await response.json();
        const company = result.data;
        if (!company) throw new Error('No company data');

        function updateMeta(id, content) {
          const el = document.getElementById(id);
          if (el && content) {
            if (el.hasAttribute('content')) {
              el.setAttribute('content', content);
            } else {
              el.textContent = content;
            }
          }
        }

        // Update page title (MÁS IMPORTANTE - tab del navegador)
        const pageTitle = company.seo_title || `${company.name || 'Laboratorio'} - Análisis Clínicos`;
        updateMeta('page-title', pageTitle);

        // Update PWA meta tags
        updateMeta('meta-pwa-title', company.pwa_short_name || company.short_name || company.name);
        updateMeta('meta-app-name', company.pwa_short_name || company.short_name || company.name);
        updateMeta('meta-theme-color', company.theme_color || '#7B68A6');

        // Update SEO meta tags
        updateMeta('meta-description', company.seo_description || '');
        updateMeta('meta-keywords', company.seo_keywords || '');
        updateMeta('meta-author', company.seo_author || company.name);

        // Update Open Graph
        updateMeta('og-title', pageTitle);
        updateMeta('og-description', company.seo_description || '');
        updateMeta('og-image', company.og_image_url || '/Logo.png');
        updateMeta('og-site-name', company.name);
        updateMeta('og-locale', company.og_locale || 'es_MX');
        updateMeta('og-url', window.location.href);

        // Update Twitter Cards
        updateMeta('twitter-title', pageTitle);
        updateMeta('twitter-description', company.seo_description || '');
        updateMeta('twitter-image', company.og_image_url || '/Logo.png');

        // Update Favicon dinámicamente
        const faviconUrl = company.favicon_url || '/LogoEG.png';
        const updateFavicon = (id, href) => {
          const el = document.getElementById(id);
          if (el) el.setAttribute('href', href);
        };
        updateFavicon('favicon-link', faviconUrl);
        updateFavicon('apple-touch-icon', faviconUrl);
        updateFavicon('icon-32', faviconUrl);
        updateFavicon('icon-16', faviconUrl);
        updateFavicon('mask-icon', faviconUrl);

        // GUARDAR en cache para próximas visitas (elimina flash futuro)
        try {
          localStorage.setItem('eg_company_cache', JSON.stringify(company));
          localStorage.setItem('eg_company_cache_timestamp', Date.now().toString());
          console.log('💾 Cache actualizado para próxima visita');
        } catch (e) {
          console.warn('No se pudo guardar en cache');
        }

        console.log('✅ Metadata dinámica cargada:', company.name);
      } catch (error) {
        console.warn('⚠️ Error cargando metadata, usando valores genéricos:', error.message);
      }
    })();
    </script>

    <!-- PerformanceObserver.supportedEntryTypes polyfill para iOS Safari < 16.4 -->
    <script>
    // Polyfill para PerformanceObserver.supportedEntryTypes
    // iOS Safari no tiene esta propiedad hasta versiones muy recientes
    // Esto previene errores al intentar observar tipos no soportados
    if (window.PerformanceObserver && !PerformanceObserver.supportedEntryTypes) {
      // Lista mínima de tipos soportados en iOS Safari 11+
      PerformanceObserver.supportedEntryTypes = ['navigation', 'resource', 'mark', 'measure', 'paint'];
    }
    </script>

    <!-- requestIdleCallback polyfill para iOS Safari < 16 -->
    <script>
    // Polyfill para soportar iOS Safari < 16 (iOS 11-15)
    // requestIdleCallback solo está disponible desde iOS 16.0+
    // Este polyfill permite que la app funcione en dispositivos iOS más antiguos
    window.requestIdleCallback = window.requestIdleCallback || function(handler) {
      const startTime = Date.now();
      return setTimeout(function() {
        handler({
          didTimeout: false,
          timeRemaining: function() {
            return Math.max(0, 50.0 - (Date.now() - startTime));
          }
        });
      }, 1);
    };

    window.cancelIdleCallback = window.cancelIdleCallback || function(id) {
      clearTimeout(id);
    };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
