# ==========================================
# Laboratorio ${LAB_NAME} - Docker Compose
# ==========================================
# Instance: ${LAB_CODE}
# Container prefix: ${INSTANCE_PREFIX}
# ==========================================

services:
  # ==========================================
  # Sync Service - PostgreSQL to JSON sync
  # ==========================================
  sync-service:
    image: ${DOCKER_REGISTRY:-ghcr.io/your-org}/lab-sync-service:${IMAGE_TAG:-latest}
    container_name: ${INSTANCE_PREFIX}-sync-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HTTP_PORT: 3002
      LABSIS_HOST: ${DB_HOST}
      LABSIS_PORT: 5432
      LABSIS_DB: ${DB_NAME_LABSIS}
      LABSIS_USER: labsis
      LABSIS_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${INSTANCE_PREFIX}-sync-data:/app/data
      - ${INSTANCE_PREFIX}-sync-logs:/app/logs
    ports:
      - "${SYNC_PORT:-3002}:3002"
    networks:
      - ${INSTANCE_PREFIX}-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==========================================
  # Results API - Patient results query service
  # ==========================================
  results-api:
    image: ${DOCKER_REGISTRY:-ghcr.io/your-org}/lab-results-api:${IMAGE_TAG:-latest}
    container_name: ${INSTANCE_PREFIX}-results-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_NAME: ${DB_NAME_LABSIS}
      DB_USER: labsis
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-20}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    volumes:
      - ${INSTANCE_PREFIX}-results-temp:/app/temp
      - ${INSTANCE_PREFIX}-results-logs:/app/logs
      - ${INSTANCE_PREFIX}-results-templates:/app/templates
    ports:
      - "${RESULTS_PORT:-3003}:3003"
    networks:
      - ${INSTANCE_PREFIX}-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==========================================
  # Messaging Bot - Telegram & WhatsApp bot
  # ==========================================
  messaging-bot:
    image: ${DOCKER_REGISTRY:-ghcr.io/your-org}/lab-messaging-bot:${IMAGE_TAG:-latest}
    container_name: ${INSTANCE_PREFIX}-messaging-bot
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      BOT_DATABASE_URL: postgresql://labsis:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME_BOT}
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_NAME: ${DB_NAME_BOT}
      DB_USER: labsis
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-20}
      DB_SSL: "false"
      LABSIS_DATABASE_URL: postgresql://labsis:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME_LABSIS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      PUBLIC_URL: ${PUBLIC_URL}:3004
      CORS_ORIGIN: ${CORS_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${INSTANCE_PREFIX}-messaging-logs:/app/logs
      - ${INSTANCE_PREFIX}-messaging-data:/app/data
    ports:
      - "${MESSAGING_PORT:-3004}:3004"
    networks:
      - ${INSTANCE_PREFIX}-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3004/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==========================================
  # Config API - Centralized configuration service
  # ==========================================
  config-api:
    image: ${DOCKER_REGISTRY:-ghcr.io/your-org}/lab-config-api:${IMAGE_TAG:-latest}
    container_name: ${INSTANCE_PREFIX}-config-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3005
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_NAME: ${DB_NAME_BOT}
      DB_USER: labsis
      DB_PASSWORD: ${DB_PASSWORD}
      CONTROL_DB: ${DB_NAME_BOT}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-20}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-8h}
      PUBLIC_URL: ${PUBLIC_URL}:3005
      CORS_ORIGIN: ${CORS_ORIGIN}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      CACHE_CHECK_PERIOD_SECONDS: ${CACHE_CHECK_PERIOD_SECONDS:-60}
      WS_PORT: 3006
      WS_HEARTBEAT_INTERVAL: ${WS_HEARTBEAT_INTERVAL:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE_PATH: logs/config-api.log
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-1000}
    volumes:
      - ${INSTANCE_PREFIX}-config-logs:/app/logs
      - ${INSTANCE_PREFIX}-config-uploads:/app/uploads
    ports:
      - "${CONFIG_PORT:-3005}:3005"
      - "${CONFIG_WS_PORT:-3006}:3006"
    networks:
      - ${INSTANCE_PREFIX}-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3005/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==========================================
  # Frontend PWA - React + Vite (served by Nginx)
  # ==========================================
  web:
    image: ${DOCKER_REGISTRY:-ghcr.io/your-org}/lab-web:${IMAGE_TAG:-latest}
    container_name: ${INSTANCE_PREFIX}-web
    restart: unless-stopped
    environment:
      VITE_API_URL: ${PUBLIC_URL}:${SYNC_PORT:-3002}/api
      VITE_CONFIG_API_URL: ${PUBLIC_URL}:${CONFIG_PORT:-3005}
      VITE_RESULTS_API_URL: ${PUBLIC_URL}:${RESULTS_PORT:-3003}
      VITE_MESSAGING_BOT_API_URL: /api/messaging
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - ${INSTANCE_PREFIX}-network
    depends_on:
      - sync-service
      - config-api
      - results-api
      - messaging-bot
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3

# ==========================================
# Networks
# ==========================================
networks:
  ${INSTANCE_PREFIX}-network:
    driver: bridge
    name: ${INSTANCE_PREFIX}-network

# ==========================================
# Volumes
# ==========================================
volumes:
  ${INSTANCE_PREFIX}-sync-data:
  ${INSTANCE_PREFIX}-sync-logs:
  ${INSTANCE_PREFIX}-results-temp:
  ${INSTANCE_PREFIX}-results-logs:
  ${INSTANCE_PREFIX}-results-templates:
  ${INSTANCE_PREFIX}-messaging-logs:
  ${INSTANCE_PREFIX}-messaging-data:
  ${INSTANCE_PREFIX}-config-logs:
  ${INSTANCE_PREFIX}-config-uploads:
